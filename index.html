<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0F14">
<title>Next Up</title>
<link rel="stylesheet" href="fonts/manrope.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<script src="sortable.min.js"></script>
<style>
:root{
  --bg:#0B0F14; --s1:#121A23; --s2:#1A2430; --s3:#2A384F; --line:rgba(94,225,255,.10); --line2:rgba(42,56,79,.75);
  --ink:#E8F1F8; --muted:#8A9BB0; --faint:#5C6B7E;
  --accent:#00D1FF; --accent2:#5EE1FF; --accent-ink:#03151C; --glow:rgba(0,209,255,.35);
  --danger:#FF7A88; --warn:#FFB86B; --ease:cubic-bezier(.25,.8,.25,1);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0B0F14;--s1:#121A23;--s2:#1A2430;--s3:#2A384F;--ink:#E8F1F8;--muted:#8A9BB0;--faint:#5C6B7E;--accent:#00D1FF;--accent2:#5EE1FF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B0F14;--s1:#121A23;--s2:#1A2430;--s3:#2A384F;--ink:#E8F1F8;--muted:#8A9BB0;--faint:#5C6B7E;--accent:#00D1FF;--accent2:#5EE1FF;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1400px 700px at 80% -10%,rgba(0,209,255,.08),transparent 60%),radial-gradient(900px 700px at 0% 40%,rgba(42,56,79,.30),transparent 60%),var(--bg);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px;border-radius:10px}
.muted{color:var(--muted)} .grow{flex:1} .small{font-size:13px}

/* shell */
.shell{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:26px 18px;border-right:1px solid var(--line);background:rgba(11,15,20,.55);backdrop-filter:blur(10px);display:flex;flex-direction:column;gap:22px;overflow:auto}
.wordmark{font-weight:600;letter-spacing:.55em;font-size:15px;text-transform:uppercase;padding:0 8px}
.tagline{color:var(--muted);font-size:13px;padding:0 8px;margin-top:-16px}
.navl{display:grid;gap:4px}
.navl button{display:flex;align-items:center;gap:12px;border:1px solid transparent;background:transparent;color:var(--muted);padding:10px 12px;border-radius:14px;font-weight:600;text-align:left}
.navl button svg{width:20px;height:20px}
.navl button:hover{color:var(--ink);background:var(--s1)}
.navl button[aria-current="page"]{color:var(--ink);background:linear-gradient(90deg,rgba(0,209,255,.16),rgba(0,209,255,.03));border-color:rgba(0,209,255,.25)}
.navl button[aria-current="page"] svg{color:var(--accent2);filter:drop-shadow(0 0 6px rgba(0,209,255,.7))}
.badge{margin-left:auto;font-size:12px;background:var(--s3);color:var(--ink);border-radius:999px;padding:1px 8px}
.cap{border:1px solid var(--line);border-radius:18px;padding:14px;background:rgba(18,26,35,.7)}
.cap h3{margin:0 0 2px;font-size:14px}
.cap p{margin:6px 0 0;font-size:12.5px;color:var(--muted)}
.cap input{width:100%;border:1px solid var(--s3);background:rgba(11,15,20,.6);border-radius:12px;padding:10px 12px;margin-top:8px}
.mini-focus{border:1px solid var(--accent);border-radius:16px;padding:12px 14px;background:rgba(0,209,255,.06);cursor:pointer;box-shadow:0 0 18px rgba(0,209,255,.12)}
.mini-focus .k{font-size:12px;color:var(--muted)}
.mini-focus .v{font-weight:600;overflow-wrap:anywhere}
.side .bottom{margin-top:auto;display:grid;gap:8px}
.main{padding:28px 36px 60px;min-width:0;max-width:2200px;width:100%}

/* headers */
.phead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.phead h1{font-size:28px;font-weight:700;margin:0;letter-spacing:-.015em}
.phead .sub{color:var(--muted);font-size:14px}

/* cards */
.card{background:linear-gradient(180deg,rgba(26,36,48,.75),rgba(18,26,35,.75));border:1px solid var(--line);border-radius:24px;padding:20px;position:relative;min-width:0}
.card h2{font-size:17px;font-weight:700;margin:0}
.card .hint{color:var(--muted);font-size:13.5px;margin:2px 0 12px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.stack{display:grid;gap:16px;align-content:start;min-width:0}

/* home */
.home-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.span2{grid-column:span 2}.span4{grid-column:1/-1}
.hero{padding:0;overflow:hidden;min-height:300px;display:flex;flex-direction:column;justify-content:flex-end}
.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero-in{position:relative;padding:26px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
.hero h1{font-size:clamp(28px,2.4vw,38px);font-weight:600;letter-spacing:-.02em;margin:0;line-height:1.1}
.hero p{margin:6px 0 0;color:#B9C8D6}
.hero .btns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.mini-ring{position:relative;width:96px;height:96px;flex:none}
.mini-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.mini-ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:700;font-size:18px;line-height:1.1}
.mini-ring .lbl small{display:block;font-size:11px;font-weight:500;color:#B9C8D6}
.now-line{display:flex;align-items:center;gap:12px;cursor:pointer;padding:10px 0;border-top:1px solid var(--line2)}
.now-line:first-of-type{border-top:none}
.now-line .k{font-size:12.5px;color:var(--muted);width:64px;flex:none}
.now-line .v{font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}
.dotc{width:9px;height:9px;border-radius:50%;background:var(--c,var(--accent));box-shadow:0 0 10px var(--c,var(--accent));flex:none}
.folder{width:100%;text-align:left;display:flex;align-items:center;gap:14px;cursor:pointer}
.folder:hover{border-color:rgba(94,225,255,.28)}
.folder .fi{width:48px;height:48px;border-radius:16px;background:rgba(0,209,255,.10);border:1px solid rgba(0,209,255,.25);display:grid;place-items:center;color:var(--accent2);flex:none}
.folder .fi svg{width:22px;height:22px}
.folder b{display:block;font-size:17px}
.folder span.sub{color:var(--muted);font-size:13.5px}
.chev{color:var(--faint);font-size:20px;line-height:1}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px}
.wday{border:1px solid var(--line2);border-radius:18px;padding:14px;background:rgba(11,15,20,.4);cursor:pointer;text-align:left;display:grid;gap:8px;align-content:start}
.wday:hover{border-color:rgba(94,225,255,.3)}
.wday.today{border-color:var(--accent);box-shadow:0 0 16px rgba(0,209,255,.15)}
.wday .dn{font-weight:700}
.wday .dl{font-size:12.5px;color:var(--muted)}
.wday ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.wday li{font-size:13px;color:#C4D2DE;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wday li.d{text-decoration:line-through;color:var(--faint)}

/* buttons */
.btn{border:1px solid var(--s3);background:var(--s1);border-radius:14px;padding:10px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:rgba(94,225,255,.35)}
.btn.primary{border:none;background:linear-gradient(90deg,#1E9BFF,var(--accent));color:var(--accent-ink);box-shadow:0 0 22px rgba(0,209,255,.22);font-weight:700}
.btn.block{width:100%}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:12px}
.btn svg{width:18px;height:18px}
.icon-btn{width:34px;height:34px;border-radius:11px;border:none;background:transparent;color:var(--muted);display:grid;place-items:center;padding:0;flex:none}
.icon-btn svg{width:17px;height:17px}
.icon-btn:hover{color:var(--ink);background:var(--s2)}
.icon-btn[aria-pressed="true"]{color:var(--accent2)}

/* forms */
.add{display:flex;gap:8px}
.add input[type=text]{flex:1;min-width:0;border:1px solid var(--s3);background:rgba(11,15,20,.55);border-radius:14px;padding:10px 13px}
.add input::placeholder,textarea::placeholder,.cap input::placeholder{color:var(--faint)}
.add select{border:1px solid var(--s3);background:rgba(11,15,20,.55);border-radius:14px;padding:0 8px;max-width:100px}

/* rows */
ul.list{list-style:none;margin:0;padding:0;min-height:12px}
.trow{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 6px;border-radius:16px;background:rgba(11,15,20,.45);border:1px solid var(--line2);margin-bottom:7px;cursor:pointer;transition:border-color .4s var(--ease),background .4s var(--ease)}
.trow:hover{border-color:rgba(94,225,255,.28)}
.trow.sel{border-color:var(--accent2);background:rgba(0,209,255,.07)}
.trow.running{border-color:var(--accent);box-shadow:0 0 18px rgba(0,209,255,.15)}
.trow.blocked .ttitle{color:var(--muted)}
.ghost{opacity:.35}
.handle{color:var(--faint);padding:6px 2px 6px 4px;cursor:grab;touch-action:none;display:flex}
.handle:hover{color:var(--accent2)}
.handle svg{width:16px;height:16px}
.check{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--s3);background:transparent;display:grid;place-items:center;padding:0;color:var(--accent-ink)}
.check svg{width:13px;height:13px;opacity:0}
.check:hover{border-color:var(--accent)}
.done .check,.check.on{background:var(--accent);border-color:var(--accent);box-shadow:0 0 10px var(--glow)}
.done .check svg,.check.on svg{opacity:1}
.tbody{flex:1;min-width:0}
.ttitle{font-weight:600;overflow-wrap:anywhere}
.done .ttitle{text-decoration:line-through;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:2px}
.chip{font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--c);display:inline-block}
.chip.late{color:var(--danger)} .chip.warn{color:var(--warn)}
.chip svg{width:12px;height:12px}
.ttime{width:92px;flex:none;font-variant-numeric:tabular-nums;line-height:1.2}
.ttime b{display:block;font-size:15.5px;color:var(--ink)}
.ttime span{font-size:12px;color:var(--muted)}
.clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;color:var(--accent2)}
.clock.idle{color:var(--muted);font-weight:600}
.clock.over{color:var(--danger)}
.empty{color:var(--muted);text-align:center;padding:16px 12px;border:1.5px dashed var(--line2);border-radius:16px;font-size:13.5px;list-style:none}
.reveal{opacity:0;transition:opacity .3s}
.trow:hover .reveal,.trow:focus-within .reveal,.step:hover .reveal{opacity:1}
.nowmark{list-style:none;position:relative;height:16px;margin:2px 0 8px}
.nowmark::before{content:"";position:absolute;left:0;right:0;top:7px;height:2px;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.nowmark span{position:absolute;left:12px;top:-1px;background:var(--bg);color:var(--accent2);font-size:11.5px;font-weight:700;padding:0 8px;border-radius:6px}

/* day */
.days{display:flex;gap:8px}
.days button{border:1px solid var(--line);background:var(--s1);border-radius:14px;padding:6px 12px;display:grid;justify-items:center;line-height:1.25;min-width:58px}
.days button small{font-size:11.5px;color:var(--muted)}
.days button b{font-size:15px}
.days button[aria-pressed="true"]{background:linear-gradient(180deg,rgba(0,209,255,.22),rgba(0,209,255,.08));border-color:var(--accent);box-shadow:0 0 16px rgba(0,209,255,.2)}
.day-grid{display:grid;grid-template-columns:minmax(300px,360px) minmax(0,1fr) minmax(380px,480px);gap:18px;align-items:start}
.sticky{position:sticky;top:20px;max-height:calc(100vh - 40px);overflow:auto}
.segb{border:1px solid color-mix(in srgb,var(--c) 30%,transparent);background:color-mix(in srgb,var(--c) 5%,rgba(18,26,35,.6));border-radius:22px;padding:6px 14px 12px;margin-bottom:14px}
.seg-h{display:flex;align-items:center;gap:12px;padding:10px 0}
.seg-h b{font-size:16px}
.seg-h .rng{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13.5px}
.fillbar{height:5px;border-radius:5px;background:rgba(138,155,176,.18);overflow:hidden;width:120px}
.fillbar i{display:block;height:100%;background:var(--c,var(--accent));box-shadow:0 0 8px var(--c,var(--accent));border-radius:5px}
.foldbtn{border:1px solid var(--s3);background:transparent;color:var(--muted);border-radius:10px;padding:4px 10px;font-size:12.5px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.foldbtn svg{width:14px;height:14px;transition:transform .3s var(--ease)}
.foldbtn[aria-expanded="false"] svg{transform:rotate(-90deg)}
.foldbtn:hover{color:var(--ink);border-color:var(--c,var(--accent))}
.segb .slist{min-height:40px;padding-bottom:4px}
.segb.folded{padding-bottom:6px}
.segb .add{margin-top:6px}

/* minimal shell */
.side{display:none}
.shell{grid-template-columns:1fr}
.main{margin:0 auto}
.navbar{display:flex;gap:8px;margin-bottom:18px}
.home-min{max-width:960px;margin:3vh auto 0}
.htabs{list-style:none;margin:0;padding:0;display:grid;gap:16px}
.htab{display:flex;align-items:center;gap:18px;padding:22px 26px;cursor:grab;user-select:none;-webkit-user-select:none;transition:border-color .4s var(--ease),box-shadow .4s var(--ease)}
.htab:hover{border-color:rgba(94,225,255,.3);box-shadow:0 0 26px rgba(0,209,255,.08)}
.htab h2{font-size:21px}
.htab .sub{color:var(--muted);font-size:14px}
.ht-text{display:grid;gap:2px;min-width:0}
.hday{min-height:170px;overflow:hidden;align-items:flex-end}
.hday > :not(.scene){position:relative}
.hday .sub{color:#B9C8D6}
.hdump{flex-direction:column;align-items:stretch;gap:14px}
.ht-row{display:flex;align-items:center;gap:18px;cursor:pointer}
.htab .add input{cursor:text}
.home-top{text-align:center;margin-bottom:18px}
.home-top .wordmark{margin-bottom:22px;padding:0}
.home-top h1{font-size:clamp(32px,3vw,46px);font-weight:600;letter-spacing:-.02em;margin:0}
.home-top p{margin:6px 0 0}
.home-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;align-items:stretch}
.hcard{display:flex;flex-direction:column;gap:10px;min-height:400px;padding:26px}
.hc-top{display:flex;align-items:center;gap:14px;margin-bottom:4px}
.hc-top h2{font-size:21px}
.fi{width:48px;height:48px;border-radius:16px;background:rgba(0,209,255,.10);border:1px solid rgba(0,209,255,.25);display:grid;place-items:center;color:var(--accent2);flex:none}
.fi svg{width:22px;height:22px}
.hc-link{margin-top:auto;border:none;background:transparent;color:var(--muted);text-align:left;padding:10px 0 0;display:flex;justify-content:space-between;align-items:center;font-weight:600;border-top:1px solid var(--line2)}
.hc-link:hover{color:var(--ink)}
.hc-day{padding:0;overflow:hidden;text-align:left;cursor:pointer;justify-content:flex-end}
.hc-day:hover{border-color:rgba(94,225,255,.35);box-shadow:0 0 30px rgba(0,209,255,.12)}
.hc-in{position:relative;display:flex;flex-direction:column;gap:8px;padding:26px}
.hc-in .hint{margin:0;color:#B9C8D6}
.hc-go{display:flex;justify-content:space-between;align-items:center;font-weight:700;color:var(--accent2);margin-top:8px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head b{font-size:15px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cwd{text-align:center;font-size:12px;color:var(--faint);font-weight:600;padding-bottom:4px}
.cday{position:relative;aspect-ratio:1;border:1px solid transparent;background:transparent;border-radius:12px;display:grid;place-items:center;font-size:14px;font-weight:600;padding:0}
.cday:hover{border-color:rgba(94,225,255,.35);background:rgba(0,209,255,.05)}
.cday.blank{pointer-events:none}
.cday.past{color:var(--faint)}
.cday.today{background:rgba(0,209,255,.14);border-color:var(--accent);color:var(--ink);box-shadow:0 0 12px rgba(0,209,255,.2)}
.cday i{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--accent2);box-shadow:0 0 6px var(--accent)}
.cday i.due{background:var(--warn);box-shadow:0 0 6px var(--warn)}
.cal-grid.big{gap:8px}
.cal-grid.big .cwd{font-size:13px;text-align:left;padding-left:8px}
.cday.big{aspect-ratio:auto;min-height:130px;place-items:start;align-content:start;text-align:left;padding:10px;border:1px solid var(--line2);background:rgba(11,15,20,.4)}
.cday.big .cn{font-size:15px;font-weight:700}
.cday.big ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:3px;width:100%;min-width:0}
.cday.big li{font-size:12.5px;font-weight:500;color:#C4D2DE;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cday.big li b{color:var(--accent2);font-weight:700}
.cday.big li.d{text-decoration:line-through;color:var(--faint)}
.cday.big li.due{color:var(--warn)}
@media (max-width:1000px){.home-cards{grid-template-columns:1fr}.hcard{min-height:0}}

.day-grid.two{grid-template-columns:minmax(0,1fr) minmax(380px,480px)}
.days-bottom{justify-content:center;margin-top:22px;flex-wrap:wrap}
@media (max-width:1000px){.day-grid.two{grid-template-columns:1fr}}

.org-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;max-width:1300px}
.org-card{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.org-card .hint{margin:0 0 6px}
.org-wide{grid-column:1/-1;align-items:stretch}
.org-anchors{list-style:none;margin:0 0 6px;padding:0;display:grid;gap:6px;width:100%}
.org-anchor{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;border:1px solid color-mix(in srgb,var(--c) 30%,transparent);background:color-mix(in srgb,var(--c) 7%,transparent)}
.org-add{width:100%;flex-wrap:wrap}
.org-add input[type=date]{border:1px solid var(--s3);background:rgba(11,15,20,.55);border-radius:14px;padding:0 10px}
@media (max-width:1000px){.org-grid{grid-template-columns:1fr}}

.day-grid.one{grid-template-columns:minmax(0,1fr);max-width:1400px;margin:0 auto}
.navbar{align-items:center}
.crumbs-bar{display:flex;align-items:center;gap:6px;margin-left:10px;color:var(--muted);font-size:14px;flex-wrap:wrap;min-width:0}
.crumbs-bar > svg{width:16px;height:16px;color:var(--faint)}
.crumb{border:none;background:transparent;color:var(--muted);padding:4px 6px;border-radius:8px;font-weight:600}
button.crumb:hover{color:var(--ink);background:var(--s1)}
.crumb.cur{color:var(--accent2);max-width:420px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.csep{color:var(--faint)}
.erow{cursor:grab}
.hhead{height:calc(var(--row) - 6px);margin-bottom:6px;display:flex;align-items:center;gap:12px;padding:0 16px;border-radius:14px;border-left:3px solid var(--c);background:linear-gradient(90deg,color-mix(in srgb,var(--c) 18%,transparent),transparent 70%);cursor:pointer;user-select:none;-webkit-user-select:none;list-style:none}
.hhead b{font-size:16px}
.hhead:hover .addhere,.arow:hover .addhere{opacity:1}
.arow .addhere{opacity:0;transition:opacity .3s}
.arow.done b{text-decoration:line-through;opacity:.7}

.task-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,1fr);gap:18px;align-items:start;max-width:1500px}

.hrow.nowrow{border:2px solid #FF9F43 !important;box-shadow:0 0 0 4px rgba(255,159,67,.10),0 0 24px rgba(255,159,67,.30)}

.step{cursor:grab;user-select:none;-webkit-user-select:none;border-radius:12px}

.check.big{width:32px;height:32px;margin-right:4px}

.task-one{max-width:900px}
.org-sel{width:100%;max-width:560px;border:1px solid var(--s3);background:rgba(11,15,20,.55);border-radius:14px;padding:10px 12px}
.org-two{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%}

.steptree{list-style:none}
.step.tnode{display:block !important;padding:0 !important;border-top:none !important;cursor:default;margin:0;gap:0;background:transparent}

.tline .tbody{min-width:0;flex:1}

.tnode:hover{background:transparent}
.tline{display:flex;align-items:center;gap:10px;padding:11px 12px;margin-bottom:8px;border-radius:16px;border:1px solid var(--line2);background:rgba(11,15,20,.45);cursor:grab;user-select:none;-webkit-user-select:none;transition:border-color .3s var(--ease),background .3s var(--ease)}
.tline:hover{border-color:rgba(94,225,255,.28)}
.tnode.open > .tline{border-color:rgba(0,209,255,.35);background:linear-gradient(90deg,rgba(0,209,255,.10),rgba(11,15,20,.45) 70%)}

.twisty{width:24px;height:24px;border:none;background:transparent;color:var(--muted);display:grid;place-items:center;padding:0;border-radius:7px;flex:none}
.twisty svg{width:14px;height:14px;transition:transform .25s var(--ease)}
.twisty.open svg{transform:rotate(90deg)}
.twisty:hover{color:var(--ink);background:var(--s2)}

.tchips{margin:0;flex-wrap:nowrap}
.tnode.done > .tline .ttitle{text-decoration:line-through;color:var(--muted)}

#sdNotes{min-height:90px}

.find-sum{list-style:none;color:var(--muted);font-size:13px;margin:4px 0 10px}
.find-list{max-height:520px;overflow:auto}

.tplsel{border:1px solid var(--s3);background:rgba(11,15,20,.55);border-radius:12px;padding:0 8px;max-width:160px}

/* hours */
.hours-card{padding:14px 16px 16px}
.hours{--row:60px;position:relative}
.tcol{list-style:none;margin:0;padding:0}
.tcol li{height:var(--row);display:flex;flex-direction:column;justify-content:center;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;font-weight:600;line-height:1.2}
.tcol li span{font-size:11.5px;font-weight:500;color:var(--faint)}
.tcol li.now{color:var(--accent2);text-shadow:0 0 10px rgba(0,209,255,.6)}
.hlist{list-style:none;margin:0;padding:0;min-width:0}
.htime{flex:none;width:52px;font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;color:var(--muted);padding-left:8px}
.htime.wide{width:118px}
.htime.now{color:var(--accent2);text-shadow:0 0 10px rgba(0,209,255,.6)}
.hrow,#poolList .trow{cursor:grab;user-select:none;-webkit-user-select:none}
.hrow .check,.hrow button{cursor:pointer}
.chosen{cursor:grabbing;border-color:var(--accent2) !important;box-shadow:0 0 18px rgba(0,209,255,.25)}
.hrow{height:calc(var(--row) - 6px);margin:0 0 6px !important;display:flex;align-items:center;gap:10px;padding:0 12px 0 6px !important;border-radius:16px;border:1px solid var(--line2);background:rgba(11,15,20,.45);overflow:hidden}
.hrow .tbody.one{display:flex;align-items:center;gap:12px;min-width:0}
.hrow .tbody.one .ttitle{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
.hrow .tbody.one .chips{flex-wrap:nowrap;overflow:hidden;margin:0;flex:1 1 auto;min-width:0}
.hrow .tbody.one .chip{white-space:nowrap}
.arow{border-color:color-mix(in srgb,var(--c) 28%,transparent);background:color-mix(in srgb,var(--c) 9%,rgba(11,15,20,.4))}
.arow b{font-size:15px}
.arow.folded{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 18%,transparent),color-mix(in srgb,var(--c) 5%,transparent));border-color:color-mix(in srgb,var(--c) 45%,transparent)}
.erow{border-style:dashed;background:transparent}
.erow .addhere{opacity:0;transition:opacity .3s}

.hnow{position:absolute;left:0;right:0;height:2px;background:var(--accent);box-shadow:0 0 10px var(--accent);pointer-events:none;z-index:2}

@media (hover:none){.erow .addhere{opacity:1}}

/* focus panel */
.ring-wrap{position:relative;width:var(--rs,220px);aspect-ratio:1;margin:4px auto 26px}

.fp-hero{padding:0;overflow:hidden}
.fp-hero .inner{position:relative;padding:22px 20px 20px;display:grid;justify-items:center;gap:6px;text-align:center}
.fp-title{font-size:21px;font-weight:700;margin:2px 0 0;cursor:text;overflow-wrap:anywhere}
.nowstep{color:var(--accent2);font-weight:600;font-size:13.5px;min-height:20px}
.fp-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.meta{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px;margin:0}
.meta dt{color:var(--muted)} .meta dd{margin:0;min-width:0}
.deplink{display:flex;align-items:center;gap:8px;cursor:pointer;padding:2px 0}
.deplink .check{width:18px;height:18px}
.deplink .check svg{width:10px;height:10px}
.step{display:flex;align-items:center;gap:10px;padding:8px 6px 8px 2px;border-top:1px solid var(--line2);list-style:none}
.step:first-child{border-top:none}
.step.current{background:rgba(0,209,255,.07);border-radius:12px;box-shadow:inset 3px 0 0 var(--accent)}
.check.sm{width:21px;height:21px}
textarea{width:100%;min-height:110px;resize:vertical;border:1px solid var(--s3);background:rgba(11,15,20,.55);border-radius:14px;padding:12px 14px;line-height:1.5}
.focus-grid{display:grid;grid-template-columns:minmax(360px,1.1fr) minmax(0,1fr) minmax(320px,.9fr);gap:18px;align-items:start}
.placeholder{display:grid;place-items:center;text-align:center;color:var(--muted);min-height:280px;gap:8px}
.placeholder svg{width:40px;height:40px;color:var(--s3)}

/* brain dump */
.dump-grid{display:grid;grid-template-columns:minmax(360px,520px) minmax(0,1fr);gap:18px;align-items:start}
.dump-big{display:flex;gap:10px;margin-bottom:18px;max-width:900px}
.dump-big input{flex:1;border:1px solid var(--s3);background:rgba(11,15,20,.55);border-radius:16px;padding:14px 16px;font-size:16px}

/* wizard */
.wiz{max-width:760px}
.wiz .dots{display:flex;gap:8px;margin-bottom:18px}
.wiz .dots button{width:30px;height:6px;border-radius:6px;border:none;background:var(--s3);padding:0}
.wiz .dots button.on{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.wiz .dots button.done{background:rgba(0,209,255,.4)}
.wiz .task{color:var(--muted);font-size:14px;margin:0 0 4px}
.wiz h2{font-size:24px;margin:0 0 18px;font-weight:700;letter-spacing:-.01em}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.opt{border:1px solid var(--s3);background:rgba(11,15,20,.45);border-radius:16px;padding:14px;text-align:left;display:grid;gap:3px}
.opt b{font-size:15px}.opt span{font-size:12.5px;color:var(--muted)}
.opt:hover{border-color:rgba(94,225,255,.4)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:rgba(0,209,255,.12);box-shadow:0 0 14px rgba(0,209,255,.18)}
.opt i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);display:inline-block;margin-bottom:4px}
.wiz-row{display:flex;align-items:center;gap:10px;margin-top:14px;color:var(--muted);font-size:14px}
.wiz-row input{border:1px solid var(--s3);background:rgba(11,15,20,.55);border-radius:12px;padding:8px 10px;width:auto}
.wiz-foot{display:flex;gap:8px;margin-top:24px;align-items:center}
.deplist{list-style:none;margin:10px 0 0;padding:0;max-height:300px;overflow:auto;display:grid;gap:6px}
.depopt{width:100%;display:flex;align-items:center;gap:10px;border:1px solid var(--line2);background:rgba(11,15,20,.45);border-radius:14px;padding:9px 12px;text-align:left}
.depopt .check{width:20px;height:20px}
.depopt[aria-pressed="true"]{border-color:var(--accent)}
.depopt[aria-pressed="true"] .check{background:var(--accent);border-color:var(--accent)}
.depopt[aria-pressed="true"] .check svg{opacity:1}
.sum{display:grid;grid-template-columns:150px 1fr;gap:10px 18px;font-size:15px;margin:0 0 6px}
.sum dt{color:var(--muted)} .sum dd{margin:0}
.search{width:100%;border:1px solid var(--s3);background:rgba(11,15,20,.55);border-radius:12px;padding:9px 12px}

/* dialogs */
dialog{border:1px solid var(--line);border-radius:26px;background:linear-gradient(180deg,#16202B,#10171F);color:var(--ink);padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 32px)}
dialog.wide{width:min(820px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(3,6,10,.7);backdrop-filter:blur(3px)}
.dlg{padding:24px}
.dlg h3{margin:0 0 14px;font-size:20px;font-weight:700}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
.field input{width:100%;border:1px solid var(--s3);background:rgba(11,15,20,.55);border-radius:14px;padding:11px 13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.quick button{border:1px solid var(--s3);background:transparent;border-radius:999px;padding:4px 12px;font-size:13.5px;color:var(--muted)}
.quick button[aria-pressed="true"]{border-color:var(--accent);color:var(--ink);background:rgba(0,209,255,.14)}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
.anchor{border:1px solid color-mix(in srgb,var(--c) 35%,transparent);background:color-mix(in srgb,var(--c) 6%,transparent);border-radius:20px;padding:14px;margin-bottom:12px}
.arow{display:flex;gap:8px;align-items:center}
.aname{flex:1;min-width:0;border:none;background:transparent;font-weight:700;font-size:17px;padding:2px 0}
.awhen{font-size:14px;margin:2px 0 10px;font-variant-numeric:tabular-nums}
.rngf{display:grid;grid-template-columns:58px 1fr;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:6px}
.rngf input{width:100%;accent-color:var(--c,var(--accent))}
.arow2{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:8px;font-size:13.5px}
.arow2 select{border:1px solid var(--s3);background:var(--s1);border-radius:12px;padding:6px 8px}
.tog{display:flex;gap:6px;align-items:center;color:var(--muted)}
.tog input{accent-color:var(--accent)}
.swatches{display:flex;gap:6px;margin-left:auto}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid transparent;background:var(--s);padding:0}
.sw.on{border-color:var(--ink);box-shadow:0 0 10px var(--s)}
.seg{display:inline-flex;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:3px;gap:2px}
.seg button{border:none;background:transparent;padding:6px 12px;border-radius:11px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--s3);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(0,209,255,.35)}

/* picker */
.spin{text-align:center;padding:28px 24px 24px}
.spin .orb{width:118px;height:118px;margin:0 auto 10px;border-radius:50%;border:3px solid var(--accent);box-shadow:0 0 30px rgba(0,209,255,.4),inset 0 0 30px rgba(0,209,255,.15);display:grid;place-items:center;color:var(--accent2)}
.spin .orb svg{width:44px;height:44px}
.spin.spinning .orb{animation:turn 1s var(--ease)}
@keyframes turn{to{transform:rotate(360deg)}}
.spin .label{color:var(--muted);font-weight:600;margin:0}
.spin .result{font-size:28px;font-weight:700;margin:8px 0 4px;min-height:2.3em;display:flex;align-items:center;justify-content:center;overflow-wrap:anywhere}
.spin .result.settled{color:var(--accent2);text-shadow:0 0 18px rgba(0,209,255,.35)}
.spin .chips{justify-content:center;min-height:22px}
.spin .why{color:var(--muted);font-size:13.5px;min-height:20px;margin-top:6px}
.spin .from{margin:16px 0 18px}
.spin .actions{justify-content:center}

.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,40px);opacity:0;background:var(--s2);border:1px solid var(--accent);color:var(--ink);padding:12px 18px;border-radius:16px;font-weight:600;transition:all .4s var(--ease);z-index:20;max-width:calc(100vw - 32px);box-shadow:0 0 24px rgba(0,209,255,.25);pointer-events:none;display:flex;gap:14px;align-items:center}
.toast.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.toast button{border:none;background:transparent;color:var(--accent2);font-weight:700;padding:0}
.screen{animation:fade .45s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (max-width:1400px){.day-grid{grid-template-columns:minmax(280px,320px) minmax(0,1fr)}.day-grid>.col3{grid-column:1/-1}.focus-grid{grid-template-columns:1fr 1fr}.week{grid-template-columns:repeat(4,1fr)}}
@media (max-width:1000px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line)}.main{padding:20px 16px 60px}.day-grid,.focus-grid,.dump-grid{grid-template-columns:1fr}.home-grid{grid-template-columns:1fr}.span2{grid-column:auto}.week{grid-template-columns:repeat(2,1fr)}.sticky{position:static;max-height:none}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<body>
<div class="shell" id="shell">
  <aside class="side" id="side"></aside>
  <main class="main" id="app"></main>
</div>

<dialog id="editDlg">
  <form class="dlg" id="editForm">
    <h3>Edit task</h3>
    <label class="field"><span>Task</span><input type="text" id="fTitle" required autocomplete="off"></label>
    <div class="field"><span>Time limit in minutes</span><input type="number" id="fDur" min="1" max="1440" placeholder="No limit"><div class="quick" id="quickDur"></div></div>
    <div class="two">
      <label class="field"><span>Day</span><input type="date" id="fDate"></label>
      <label class="field"><span>Start time</span><input type="time" id="fTime"></label>
    </div>
    <div class="actions">
      <button class="btn ghost danger" type="button" id="delBtn">Delete</button>
      <button class="btn" type="button" id="detailsBtn">Due date, importance and order…</button>
      <span class="grow"></span>
      <button class="btn" type="button" id="cancelBtn">Cancel</button>
      <button class="btn primary" type="submit">Save</button>
    </div>
  </form>
</dialog>

<dialog id="stepDlg">
  <form class="dlg" id="sdForm">
    <h3>Edit</h3>
    <label class="field"><span>Name</span><input type="text" id="sdName" required autocomplete="off"></label>
    <div class="field"><span>How long</span><div class="quick" id="sdDur"></div></div>
    <label class="field"><span>Notes</span><textarea id="sdNotes" placeholder="Anything you'll want to remember"></textarea></label>
    <div class="actions"><button class="btn" type="button" id="sdCancel">Cancel</button><button class="btn primary" type="submit">Save</button></div>
  </form>
</dialog>

<dialog id="wizDlg" class="wide"><div class="dlg" id="wizBox"></div></dialog>

<dialog id="shapeDlg">
  <div class="dlg">
    <h3>Day shape</h3>
    <p class="muted" style="margin:-8px 0 14px;font-size:14px">The constants that hold your day together. Slide them to fit.</p>
    <div id="shapeBody"></div>
    <div class="actions"><button class="btn primary" type="button" data-act="close-shape">Done</button></div>
  </div>
</dialog>

<dialog id="spinDlg">
  <div class="spin" id="spinBox">
    <div class="orb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.3" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.3" fill="currentColor"/></svg></div>
    <p class="label">Your next job</p>
    <div class="result" id="spinResult" aria-live="polite"></div>
    <div class="chips" id="spinChips"></div>
    <div class="why" id="spinWhy"></div>
    <div class="from"><div class="seg" role="group" aria-label="Pick from">
      <button type="button" data-act="pool" data-pool="all" aria-pressed="true">Everything</button>
      <button type="button" data-act="pool" data-pool="today" aria-pressed="false">Today's plan</button>
      <button type="button" data-act="pool" data-pool="dump" aria-pressed="false">Brain dump</button>
    </div></div>
    <div class="actions">
      <button class="btn" type="button" data-act="spin-close">Not now</button>
      <button class="btn" type="button" data-act="spin-again" id="spinAgain">Spin again</button>
      <button class="btn primary" type="button" data-act="spin-start" id="spinStart">Start now</button>
    </div>
  </div>
</dialog>

<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button type="button" id="toastBtn" hidden></button></div>

<script>
(function(){
  const KEY = 'nextup.v2', OLD = 'nextup.v1';
  const COLORS = ['#8B93FF', '#00D1FF', '#4FD1A5', '#FFB86B', '#FF8FB1'];
  const IMP = [
    { name: 'Low', sub: 'Nice to do', c: '#8A9BB0' },
    { name: 'Medium', sub: 'Should get done', c: '#5EE1FF' },
    { name: 'High', sub: 'Needs doing soon', c: '#FFB86B' },
    { name: 'Must do', sub: 'Real consequences if not', c: '#FF7A88' }

  // ---------- plan my week ----------
  function planWeek(){
    const snap = JSON.stringify({ tasks: state.tasks, layout: state.layout }), td = today(), nh = new Date().getHours();
    const days = [...Array(7)].map((_, i) => addDays(td, i));
    const Ls = {}, free = [];
    days.forEach((d, i) => { Ls[d] = layoutFor(d); Ls[d].forEach((x, h) => { if (x.k === 'e' && !(i === 0 && h <= nh)) free.push({ d, di: i, h, used: false }); }); });
    const load = {}; days.forEach(d => { load[d] = tasksOn(d).filter(isOpen).reduce((a, t) => a + (t.dur || 0), 0); });
    const known = {};
    state.tasks.forEach(t => {
      if (t.status === 'done') known[t.id] = -1e9;
      else if (t.status === 'planned'){ const dd = t.date || td, di = days.indexOf(dd); known[t.id] = di < 0 ? (dd < td ? -1e9 : 1e9) : di * 1440 + (t.start || 0) + 60; }
    });
    let cands = poolTasks(), placed = 0, skipped = 0;
    while (cands.length){
      const ready = cands.filter(t => t.deps.every(id => !get(id) || known[id] != null));
      if (!ready.length) break;
      ready.sort((a, b) => score(b) - score(a));
      const t = ready[0]; cands = cands.filter(x => x !== t);
      const need = t.dur || 30, after = Math.max(-1e9, ...t.deps.map(id => known[id] == null ? -1e9 : known[id]));
      const f = free.find(f => !f.used && f.di * 1440 + f.h * 60 >= after && !(load[f.d] > 0 && load[f.d] + need > state.cap));
      if (!f){ skipped++; continue; }
      f.used = true; Ls[f.d][f.h] = { k: 't', id: t.id }; t.status = 'planned'; t.date = f.d; t.start = f.h * 60;
      load[f.d] += need; known[t.id] = f.di * 1440 + f.h * 60 + 60; placed++;
    }
    days.forEach(d => syncLayout(d, Ls[d]));
    const waiting = cands.length;
    save(); render();
    if (placed) toast(`Planned ${placed} ${placed === 1 ? 'task' : 'tasks'} across your week${skipped ? `, ${skipped} didn't fit` : ''}${waiting ? `, ${waiting} waiting on unsorted tasks` : ''}.`, ['Undo', () => { const o = JSON.parse(snap); state.tasks = o.tasks.map(norm); state.layout = o.layout; save(); render(); }]);
    else toast(poolTasks().length ? 'Nothing fitted. Try a higher daily max in Day shape.' : 'Your task pool is empty. Sort some brain dump notes first.');
  }

      case 'del-tpl': { const x = state.templates.find(y => y.id === ds.id); const snap = JSON.stringify(state.templates); state.templates = state.templates.filter(y => y.id !== ds.id); save(); render(); toast('Removed ' + (x ? x.title : '') + ' from Use again', ['Undo', () => { state.templates = JSON.parse(snap); save(); render(); }]); break; }
      case 'focus-mode': go({ s: 'timer', id: ds.id }); break;
      case 'set-focus': { const t = get(ds.id); if (t){ t.dur = +ds.m; t.remaining = null; t.runningSince = null; toggleTimer(t.id); } break; }
      case 'crumb': { const i = +ds.i; ui.scr = ui.hist[i]; ui.hist = ui.hist.slice(0, i); ui.addAt = null; render(); window.scrollTo(0, 0); break; }
      case 'home': ui.hist = []; ui.addAt = null; ui.scr = { s: 'home' }; render(); window.scrollTo(0, 0); break;
      case 'cal-nav': { const [y, m] = curMonth().split('-').map(Number); const dt = new Date(y, m - 1 + Number(ds.dir), 1); ui.calMonth = dt.getFullYear() + '-' + pad(dt.getMonth() + 1); render(); break; }
      case 'pool-today': {
        const t = get(ds.id); if (!t) break; const d = today(), L = layoutFor(d);
        const h = placeNear(L, firstHour(d), { k: 't', id: t.id });
        if (h < 0){ toast('No free hours left today'); break; }
        syncLayout(d, L); save(); render(); toast(`Added to today at ${pad(h)}:00`); break;
      }
      case 'cal-today': ui.calMonth = today().slice(0, 7); render(); break;
      case 'open-day': ui.scrollNow = ds.date === today(); go({ s: 'day', date: ds.date }); break;
      case 'set-date': ui.addAt = null; ui.scr = { s: 'day', date: ds.date }; ui.scrollNow = ds.date === today(); render(); break;
      case 'open-focus': go({ s: 'focus', id: ds.id }); break;
      case 'fold': {
        if (ds.aid){ const x = state.anchors.find(y => y.id === ds.aid); if (x) x.fold = !x.fold; }
        else state.fold[ds.name] = !state.fold[ds.name];
        save(); render(); break;
      }
      case 'add-at': ui.addAt = +ds.h; ui.refocus = 'form[data-kind="at"] input'; render(); break;
      case 'cancel-add': ui.addAt = null; render(); break;
      case 'edit': openEdit(ds.id); break;
      case 'del': { const x = get(ds.id); const show = undoable('Deleted ' + (x ? x.title : 'task')); state.tasks = state.tasks.filter(t => t.id !== ds.id); setTimeout(show); } state.tasks.forEach(t => { t.deps = t.deps.filter(x => x !== ds.id); }); save(); render(); break;
      case 'reset': { const t = get(ds.id); if (t){ t.remaining = null; t.runningSince = null; t.alerted = false; save(); render(); toast('Timer reset'); } break; }
      case 'toggle-step': { const n = nodeAt(get(ds.tid), splitPath(ds.path)), s = n && n.subtasks.find(x => x.id === ds.sid); if (s){ s.done = !s.done; save(); render(); } break; }
      case 'twisty': { const n = nodeAt(get(ds.tid), splitPath(ds.path)), st = n && n.subtasks.find(x => x.id === ds.sid); if (st){ st.open = !st.open; save(); render(); } break; }
      case 'step-edit': openStepEdit(); break;
      case 'dive': diveTo(ds.tid, splitPath(ds.path).concat(ds.sid)); break;
      case 'step-dur': { const n = nodeAt(get(ui.scr.id), ui.scr.path || []); if (n){ n.dur = +ds.m; save(); render(); } break; }
      case 'del-step': { const n = nodeAt(get(ds.tid), splitPath(ds.path)); if (n){ const st = n.subtasks.find(x => x.id === ds.sid); const show = undoable('Deleted ' + (st ? st.title : 'step')); n.subtasks = n.subtasks.filter(x => x.id !== ds.sid); save(); if (ds.back) back(); else render(); show(); } break; }
      case 'shape': renderShape(); $('#shapeDlg').showModal(); break;
      case 'close-shape': $('#shapeDlg').close(); save(); break;
      case 'add-anchor': resetLayouts(); state.anchors.push({ id: uid(), name: 'New constant', start: 12 * 60, len: 60, days: 'all', color: '#4FD1A5', fold: false }); save(); renderShape(); render(); break;
      case 'del-anchor': resetLayouts(); state.anchors = state.anchors.filter(x => x.id !== ds.aid); save(); renderShape(); render(); break;
      case 'anchor-color': { const x = state.anchors.find(y => y.id === ds.aid); if (x){ x.color = ds.c; save(); renderShape(); render(); } break; }
      case 'plan-week': planWeek(); break;
      case 'wiz-open': openWiz(ds.id); break;
      case 'wiz-go': ui.wiz.step = Math.max(0, Math.min(4, +ds.step)); refreshWiz(); break;
      case 'wiz-due': { const t = get(ui.wiz.id); if (t){ t.due = ds.v; save(); wizNext(); } break; }
      case 'wiz-imp': { const t = get(ui.wiz.id); if (t){ t.imp = +ds.v; save(); wizNext(); } break; }
      case 'wiz-dur': { const t = get(ui.wiz.id); if (t){ t.dur = +ds.v; t.remaining = null; save(); wizNext(); } break; }
      case 'wiz-dep': { const t = get(ds.tid); if (t){ t.deps = t.deps.includes(ds.id) ? t.deps.filter(x => x !== ds.id) : t.deps.concat(ds.id); save(); el.setAttribute('aria-pressed', String(t.deps.includes(ds.id))); } break; }
      case 'wiz-save': case 'wiz-today': {
        const t = get(ds.id); if (!t) break;
        if (a === 'wiz-today'){ t.status = 'planned'; t.date = today(); t.start = null; }
        else if (t.status === 'inbox') t.status = 'pool';
        save();
        if ($('#wizDlg').open){ $('#wizDlg').close(); render(); }
        else { const nxt = inbox()[0]; ui.bdSel = nxt ? nxt.id : null; ui.wiz = { id: ui.bdSel, step: 0 }; render(); }
        toast(a === 'wiz-today' ? 'Added to today' : t.status === 'pool' ? 'Saved to your task pool' : 'Saved');
        break;
      }
      case 'pick': ensureAudio(); ui.pickedId = null; $('#spinDlg').showModal(); spin(); break;
      case 'pool': ui.pool = ds.pool; document.querySelectorAll('[data-pool]').forEach(b => b.setAttribute('aria-pressed', String(b === el))); ui.pickedId = null; spin(); break;
      case 'spin-again': spin(); break;
      case 'spin-close': clearInterval(spinT); $('#spinDlg').close(); break;
      case 'spin-start': {
        const t = get(ui.pickedId); if (!t) return;
        if (t.status === 'inbox' || t.status === 'pool'){ t.status = 'planned'; t.date = today(); t.start = null; }
        if (t.dur == null){ t.dur = 25; t.remaining = null; toast('Set to 25 min. Double-click the title to change it.'); }
        $('#spinDlg').close(); ui.hist.push(ui.scr); ui.scr = { s: 'timer', id: t.id };
        if (!t.runningSince) toggleTimer(t.id); else { save(); render(); }
        window.scrollTo(0, 0); break;
      }
    }
  }

  document.addEventListener('submit', e => {
    const f = e.target; if (!f.dataset.kind) return; e.preventDefault();
    const title = (f.elements.title && f.elements.title.value || '').trim(); if (!title) return;
    const k = f.dataset.kind, d = (f.elements.date && f.elements.date.value) || ui.scr.date || today();
    if (k === 'cap'){ addTask({ title, status: 'inbox' }); ui.refocus = f.classList.contains('dump-big') ? '.dump-big input' : '.cap input'; render(); toast('Tucked away in your brain dump'); }
    else if (k === 'add' || k === 'at'){
      const L = layoutFor(d), dur = f.elements.dur && f.elements.dur.value ? +f.elements.dur.value : null;
      const t = addTask({ title, status: 'planned', date: d, dur });
      const h = k === 'at' ? +f.dataset.h : firstHour(d);
      const got = k === 'at' && L[h].k === 'e' ? (L[h] = { k: 't', id: t.id }, h) : placeNear(L, h, { k: 't', id: t.id });
      if (got < 0){ state.tasks = state.tasks.filter(x => x !== t); toast('No free hours left on this day'); }
      else { syncLayout(d, L); ui.sel = t.id; if (ui.scr.s === 'org') toast(`Added to ${dayName(d)} at ${pad(got)}:00`); }
      ui.addAt = null; save(); if (k === 'add') ui.refocus = 'form[data-kind="add"] input'; render();
    }
    else if (k === 'step'){
      const n = nodeAt(get(f.dataset.tid), splitPath(f.dataset.path)); if (!n) return; const keep = f.elements.dur.value;
      n.subtasks.push({ id: uid(), title, dur: +keep || 0, done: false, subtasks: [], notes: '' }); save(); render();
      const nf = document.querySelector('form[data-kind="step"]'); if (nf){ nf.elements.dur.value = keep; nf.elements.title.focus(); }
    }
    else if (k === 'prereq'){
      const t = get(f.dataset.tid); if (!t) return;
      const n = addTask({ title, status: 'inbox', due: t.due, imp: t.imp });
      t.deps.push(n.id); save(); refreshWiz(); toast('Added to brain dump to sort later');
      const ni = document.querySelector('form[data-kind="prereq"] input'); if (ni) ni.focus();
    }
  });

  // ---------- ticking ----------
  setInterval(() => {
    const t = state.tasks.find(x => x.runningSince); if (!t) return; updateClocks();
    const r = remainingOf(t);
    if (r <= 0 && !t.alerted){ t.alerted = true; save(); chime(); toast('Time\u2019s up: ' + t.title); }
    document.title = (r < 0 ? 'Over ' : '') + fmt(r) + ' \u2013 ' + t.title;
  }, 1000);
  let lastMin = nowMin();
  setInterval(() => {
    const m = nowMin(); if (m === lastMin) return; lastMin = m;
    if (document.querySelector('dialog[open]') || (document.activeElement && document.activeElement.matches('input,textarea,select'))) return;
    if (ui.scr.s === 'day' || ui.scr.s === 'home') render();
  }, 15000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !document.querySelector('dialog[open]')) render(); });


  // ---------- backup + restore ----------
  function backupText(){ return JSON.stringify(Object.assign({ app: 'nextup', exportedAt: new Date().toISOString() }, state)); }
  let bkArm = 0;
  function restoreFrom(txt){
    let p; try { p = JSON.parse((txt || '').trim()); } catch (e) { toast('That doesn\'t look like a Next Up backup'); return; }
    if (!p || !Array.isArray(p.tasks)){ toast('That doesn\'t look like a Next Up backup'); return; }
    const b = document.querySelector('[data-bk="restore"]');
    if (Date.now() - bkArm > 5000){ bkArm = Date.now(); if (b) b.textContent = 'Tap again to replace everything here with ' + p.tasks.length + ' tasks'; window._bkPending = txt; return; }
    bkArm = 0;
    try { localStorage.setItem('nextup.beforeRestore', JSON.stringify(state)); } catch (e) {}
    delete p.app; delete p.exportedAt;
    try { localStorage.setItem(KEY, JSON.stringify(p)); } catch (e) { toast('Could not save on this device'); return; }
    state = { tasks: [], anchors: DEF_ANCHORS(), fold: {}, cap: 180, layout: {}, v3: true, homeOrder: ['day', 'dump', 'cal', 'org'], templates: [] };
    load(); render(); toast('Restored ' + state.tasks.length + ' tasks');
  }
  document.addEventListener('click', async e => {
    const b = e.target.closest('[data-bk]'); if (!b || b.tagName === 'INPUT') return;
    const k = b.dataset.bk;
    if (k === 'copy'){
      const txt = backupText();
      try { await navigator.clipboard.writeText(txt); toast('Backup copied. Paste it into Next Up on your other device.'); }
      catch (err) { const ta = document.getElementById('bkText'); ta.value = txt; ta.focus(); ta.select(); toast('Copy blocked here. The backup is in the box below, select all and copy it.'); }
    } else if (k === 'save'){
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([backupText()], { type: 'application/json' }));
      a.download = 'next-up-backup-' + today() + '.json'; document.body.appendChild(a); a.click(); a.remove(); toast('Backup saved to your downloads');
    } else if (k === 'restore'){
      const v = document.getElementById('bkText').value;
      restoreFrom(v || window._bkPending);
    }
  });
  document.addEventListener('change', e => {
    const f = e.target.closest('input[data-bk="file"]'); if (!f || !f.files[0]) return;
    f.files[0].text().then(txt => { document.getElementById('bkText').value = txt; restoreFrom(txt); });
  });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  load(); render();
})();
</script>
</body>
